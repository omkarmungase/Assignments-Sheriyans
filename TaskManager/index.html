<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="left">
        <div class="icon">
          <i class="ri-file-list-2-fill"></i>
          <h3>Task <br />Manager</h3>
        </div>
        <div class="sidebar">
          <div class="dashboard">
            <i class="ri-home-4-line"></i>
            <a href="#"><h3>Dashboard</h3></a>
          </div>
          <div class="dashboard">
            <i class="ri-list-check"></i>
            <a href="#"><h3>Task</h3></a>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="status">
          <div class="statustop">
            <i class="ri-file-add-line"></i>Add New Task
          </div>
          <form action="">
            <p>Task title</p>
            <input id="inp1" type="text" placeholder="Enter the task.." />
            <p>Category</p>
            <input id="inp2" type="text" placeholder="Work" />
            <button>+ Add Task</button>
          </form>
        </div>
        <div class="addtask status">
          <h3><i class="ri-bubble-chart-line"></i> Status</h3>
          <div class="pending"><i class="ri-todo-line"></i> Total Task</div>
          <div class="pending"><i class="ri-focus-2-line"></i> Completed</div>
          <div class="pending"><i class="ri-time-line"></i>pending</div>
        </div>
        <div class="taskbar">
          
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
